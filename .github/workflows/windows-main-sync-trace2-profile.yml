name: Temporary Windows fixture Git phase observation
on:
  push:
    branches: [codex/windows-main-sync-trace2]
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        observation: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Observe original full shard with unchanged concurrency and Git limit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tmp | Out-Null
          node --import ./.scratch/windows-main-sync-trace2/trace-push.mjs --test --test-concurrency=2 --test-shard=3/8 --test-reporter=tap *> tmp/windows-main-sync-trace2.tap
          $fixtureExit = $LASTEXITCODE
          Get-Content tmp/windows-main-sync-trace2.tap
          exit $fixtureExit
      - name: Verify real-Git refusal diagnostic control
        run: node .scratch/windows-main-sync-trace2/verify-trace.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-main-sync-trace2-${{ matrix.observation }}-${{ github.sha }}
          path: tmp/windows-main-sync-trace2.tap
          if-no-files-found: error
