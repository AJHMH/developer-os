name: Temporary coverage runtime diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/coverage-runtime-probe.yml
      - .scratch/aios-v1-implementation/coverage-runtime-probe.mjs
permissions:
  contents: read
jobs:
  probe:
    name: Diagnostic base instrumentation (${{ matrix.concurrency }} files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        concurrency: [1, 2, 4, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: AJHMH/software-factory
          ref: dda7ff97b3b5f83ac4af8be62fc531aa7ca4514b
          path: factory
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
        working-directory: factory
      - name: Materialize the exact failed baseline
        run: |
          mkdir baseline probe-results
          git archive 1fe02cc983f9f05f215ad5a32068655fb6071ddd | tar -x -C baseline
      - run: npm ci --ignore-scripts
        working-directory: baseline
      - run: npm run build
        working-directory: baseline
      - name: Measure with the unchanged 120-second process deadline
        env:
          PROBE_CONCURRENCY: ${{ matrix.concurrency }}
        run: node .scratch/aios-v1-implementation/coverage-runtime-probe.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-runtime-${{ matrix.concurrency }}
          path: probe-results/timing.json
          if-no-files-found: error
          retention-days: 14
