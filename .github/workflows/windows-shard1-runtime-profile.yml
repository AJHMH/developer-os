name: Temporary Windows shard 1 runtime profile
on:
  push:
    branches: [codex/windows-shard1-runtime-profile]
permissions:
  contents: read
jobs:
  profile:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        observation: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Original shard and concurrency with bounded process timing
        shell: pwsh
        run: |
          $profilePath = (Resolve-Path .scratch/windows-shard1-runtime/process-profile.mjs).Path
          $profileUri = [System.Uri]::new($profilePath).AbsoluteUri
          $env:NODE_OPTIONS = "--import=$profileUri"
          $env:AIOS_PROCESS_PROFILE = Join-Path $env:GITHUB_WORKSPACE 'tmp/windows-shard1-profile'
          node --test --test-concurrency=2 --test-shard=1/8 --test-reporter=tap 2>&1 | Tee-Object -FilePath windows-shard1.tap
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-shard1-runtime-${{ matrix.observation }}-${{ github.sha }}
          path: |
            windows-shard1.tap
            tmp/windows-shard1-profile
          if-no-files-found: error
