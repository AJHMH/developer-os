name: Developer OS CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  pin-impact:
    name: State the pin impact of a moved guest digest
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pin-impact.mjs
  validate:
    name: Validate Developer OS CLI${{ matrix.os == 'macos-latest' && ' (macOS)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Regenerate source navigation and check freshness
        if: matrix.os == 'ubuntu-latest'
        env:
          DO_NOT_TRACK: '1'
        run: |
          npx --yes @nanonets/graft@0.16.0 build
          npx --yes @nanonets/graft@0.16.0 check
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
