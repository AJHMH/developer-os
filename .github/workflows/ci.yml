name: Developer OS CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate Developer OS CLI${{ matrix.os == 'macos-latest' && ' (macOS)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  windows-tests:
    name: Windows CLI tests (${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      # Node partitions its complete discovered test inventory across these eight
      # shards. Run one file at a time on each runner: competing file processes
      # can starve cold Windows storage/Python helpers past their safety deadlines.
      - name: Run all tests assigned to this shard
        shell: pwsh
        env:
          TEST_SHARD: ${{ matrix.shard }}/8
        run: |
          node --test --test-concurrency=1 --test-shard=$env:TEST_SHARD --test-reporter=tap 2>&1 | Tee-Object -FilePath windows-tests.tap
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tests-${{ matrix.shard }}
          path: windows-tests.tap
          if-no-files-found: warn
          retention-days: 14
  windows:
    # Preserve the exact required check name; success requires every shard.
    name: Validate Developer OS CLI (Windows)
    needs: windows-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all Windows shards to pass
        env:
          WINDOWS_RESULT: ${{ needs.windows-tests.result }}
        run: test "$WINDOWS_RESULT" = success
