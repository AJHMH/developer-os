name: Developer OS CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: Validate Developer OS CLI${{ matrix.os == 'macos-latest' && ' (macOS)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  windows-auth-startup:
    name: Cold Windows authentication storage
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      # A fresh runner exercises native registration before any helper is warm.
      # The complete eight-shard inventory below still runs every test.
      - run: node --test --test-concurrency=1 --test-name-pattern="^separate darwin authorization completes|^Windows host storage works without PowerShell" tests/auth-host.test.mjs tests/windows-auth-store.test.mjs
  windows-tests:
    name: Windows CLI tests (${{ matrix.shard }}/8)
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      # Node partitions its complete discovered test inventory across these eight
      # shards. Keep two files per runner to bound native helper contention.
      - name: Run all tests assigned to this shard
        shell: pwsh
        env:
          TEST_SHARD: ${{ matrix.shard }}/8
        run: |
          node --import ./.scratch/aios-v1-implementation/diagnostics/python-subprocess-probe.mjs --test --test-concurrency=2 --test-shard=$env:TEST_SHARD --test-reporter=tap 2>&1 | Tee-Object -FilePath windows-tests.tap
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tests-${{ matrix.shard }}
          path: windows-tests.tap
          if-no-files-found: warn
          retention-days: 14
  windows:
    # Preserve the exact required check name; success requires every shard.
    name: Validate Developer OS CLI (Windows)
    needs: windows-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require all Windows shards to pass
        env:
          WINDOWS_RESULT: ${{ needs.windows-tests.result }}
        run: test "$WINDOWS_RESULT" = success

  windows-python-probe:
    name: Diagnose Windows Python subprocesses
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Repeat isolated and concurrent fixture probes
        shell: pwsh
        run: |
          $probeFailed = $false
          $pattern = "^synthetic expiry arms|^generated native management freezes"
          foreach ($iteration in 1..3) {
            "[DEBUG-pr39-probe] isolated iteration $iteration" | Tee-Object -FilePath windows-python-probe.tap -Append
            node --import ./.scratch/aios-v1-implementation/diagnostics/python-subprocess-probe.mjs --test --test-concurrency=1 --test-reporter=tap --test-name-pattern=$pattern tests/codex-endpoint.test.mjs tests/podman-platform.test.mjs 2>&1 | Tee-Object -FilePath windows-python-probe.tap -Append
            if ($LASTEXITCODE -ne 0) { $probeFailed = $true }
          }
          $pattern += "|^actual local conditional deletion"
          foreach ($iteration in 1..3) {
            "[DEBUG-pr39-probe] concurrent iteration $iteration" | Tee-Object -FilePath windows-python-probe.tap -Append
            node --import ./.scratch/aios-v1-implementation/diagnostics/python-subprocess-probe.mjs --test --test-concurrency=2 --test-reporter=tap --test-name-pattern=$pattern tests/branch-cleanup-cas.test.mjs tests/codex-endpoint.test.mjs tests/podman-platform.test.mjs 2>&1 | Tee-Object -FilePath windows-python-probe.tap -Append
            if ($LASTEXITCODE -ne 0) { $probeFailed = $true }
          }
          if ($probeFailed) { exit 1 }
      - name: Repeat original Python source without child markers
        if: always()
        shell: pwsh
        env:
          AIOS_DIAGNOSTIC_PYTHON_MARKERS: off
        run: |
          foreach ($iteration in 1..100) {
            "[DEBUG-pr39-probe] passive management iteration $iteration" | Tee-Object -FilePath windows-python-probe.tap -Append
            node --import ./.scratch/aios-v1-implementation/diagnostics/python-subprocess-probe.mjs --test --test-concurrency=1 --test-reporter=tap --test-name-pattern="^generated native management freezes" tests/podman-platform.test.mjs 2>&1 | Tee-Object -FilePath windows-python-probe.tap -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($iteration in 1..10) {
            "[DEBUG-pr39-probe] passive expiry iteration $iteration" | Tee-Object -FilePath windows-python-probe.tap -Append
            node --import ./.scratch/aios-v1-implementation/diagnostics/python-subprocess-probe.mjs --test --test-concurrency=1 --test-reporter=tap --test-name-pattern="^synthetic expiry arms" tests/codex-endpoint.test.mjs 2>&1 | Tee-Object -FilePath windows-python-probe.tap -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-python-probe
          path: windows-python-probe.tap
          if-no-files-found: warn
          retention-days: 14
