name: Factory Adoption
run-name: factory-consumer-review:${{ github.event.pull_request.number || 0 }}:${{ github.event.pull_request.head.sha || github.sha }}:${{ github.event.pull_request.base.sha || github.sha }}
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact reviewed PR head to certify
        required: true
        type: string
      producer_run_id:
        description: Successful exact-head PR adoption run
        required: true
        type: string
      pull_request_number:
        description: Reviewed merged adoption PR
        required: true
        type: string
      evidence_bundle:
        description: Complete exact-revision evidence JSON
        required: true
        type: string
permissions:
  contents: read
jobs:
  validation:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
      pull-requests: read
      security-events: read
    uses: AJHMH/software-factory/.github/workflows/factory-consumer-validation.yml@f78ebdbcfcde6138ec8f63c11c2e6a984a72dce9
    with:
      source_revision: ${{ github.event.pull_request.head.sha || github.sha }}
  certification:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: AJHMH/software-factory/.github/workflows/factory-consumer-certification.yml@f78ebdbcfcde6138ec8f63c11c2e6a984a72dce9
    with:
      source_revision: ${{ inputs.source_revision }}
      producer_run_id: ${{ inputs.producer_run_id }}
      pull_request_number: ${{ inputs.pull_request_number }}
      evidence_bundle: ${{ inputs.evidence_bundle }}
    secrets:
      FACTORY_GITHUB_TOKEN: ${{ secrets.FACTORY_CERTIFICATION_READ_TOKEN }}
