name: Temporary Windows storage phase profile
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  profile:
    if: github.head_ref == 'codex/windows-auth-startup-profile'
    name: Native storage phase profile (${{ matrix.sample }}/4)
    runs-on: windows-latest
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node .scratch/windows-ci-storage-startup/profile-native-startup.mjs storage-profile.json --approve-synthetic-storage-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: storage-phase-profile-${{ matrix.sample }}
          path: storage-profile.json
          if-no-files-found: error
          retention-days: 14
