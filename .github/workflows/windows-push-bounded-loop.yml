name: Temporary bounded Windows fixture pushes
on:
  push:
    branches: [codex/windows-push-bounded-loop]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        observation: [1, 2]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Bounded fresh fixture remotes with original Git deadlines
        shell: pwsh
        env:
          AIOS_DIAGNOSTIC_REVISION: ${{ github.sha }}
        run: |
          node --test-reporter=tap .scratch/windows-push-bounded-loop/paired.mjs --approve-native-windows-loop 2>&1 | Tee-Object -FilePath windows-push-paired.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-push-loop-${{ matrix.observation }}-${{ github.sha }}
          path: |
            windows-push-paired.log
            tmp/windows-push-paired-*
          if-no-files-found: error
